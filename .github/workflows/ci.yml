name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y zsh tmux shellcheck gawk mawk lua5.4 pandoc inotify-tools

      - name: Install watchexec
        run: |
          asset=watchexec-2.5.1-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/watchexec/watchexec/releases/download/v2.5.1/${asset}.tar.xz" -o watchexec.tar.xz
          echo "9efabd08de720c1ee7e57b487fe11904f0966828e76146e2b5ea5deee90626be  watchexec.tar.xz" | sha256sum -c -
          tar -xJf watchexec.tar.xz
          sudo install "${asset}/watchexec" /usr/local/bin/watchexec
          watchexec --version

      - name: zsh syntax check
        run: |
          zsh -n zsh/hxp-lib.zsh
          zsh -n zsh/hxp-main.zsh
          zsh -n bin/hxp-compile
          zsh -n bin/hxp-first-error

      - name: bash syntax check
        run: |
          for f in bin/hxp-jump bin/hxp-mdline bin/hxp-fwd bin/hxp-texline bin/hxp-typtext bin/hxp-dual-panelify bin/hxp-sessions install.sh; do
            bash -n "$f"
          done
          sh -n bin/hxp-resume

      - name: shellcheck
        run: shellcheck -S warning bin/hxp-jump bin/hxp-mdline bin/hxp-fwd bin/hxp-texline bin/hxp-typtext bin/hxp-dual-panelify bin/hxp-sessions bin/hxp-resume install.sh test/sessions-test.sh test/resume-test.sh

      - name: lua syntax check (micro plugin and Pandoc filter)
        run: |
          luac5.4 -p config/micro/plug/hxpfwd/hxpfwd.lua
          luac5.4 -p filters/cjk-bibliography.lua

      - name: parser tests (runs under gawk + mawk)
        run: zsh test/parse-test.zsh

      - name: workflow regressions (mock viewers and watchers)
        run: zsh test/workflow-test.zsh

      - name: inverse source lookup
        run: python3 -B test/inverse-test.py

      - name: search pane targeting (private tmux server)
        run: python3 -B test/search-tmux-test.py

      - name: session listing (hxp-sessions)
        run: bash test/sessions-test.sh

      - name: tmux restore (hxp-resume, private tmux server)
        run: bash test/resume-test.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zsh pandoc texlive-xetex texlive-latex-extra latexmk inotify-tools \
            texlive-lang-cjk fonts-noto-cjk poppler-utils

      - name: Install watchexec
        run: |
          asset=watchexec-2.5.1-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/watchexec/watchexec/releases/download/v2.5.1/${asset}.tar.xz" -o watchexec.tar.xz
          echo "9efabd08de720c1ee7e57b487fe11904f0966828e76146e2b5ea5deee90626be  watchexec.tar.xz" | sha256sum -c -
          tar -xJf watchexec.tar.xz
          sudo install "${asset}/watchexec" /usr/local/bin/watchexec
          watchexec --version

      - name: Install typst
        run: |
          asset=typst-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/typst/typst/releases/latest/download/${asset}.tar.xz" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo install "${asset}/typst" /usr/local/bin/typst
          typst --version

      - name: smoke tests
        run: |
          zsh test/smoke.zsh
          python3 -B test/inverse-test.py
